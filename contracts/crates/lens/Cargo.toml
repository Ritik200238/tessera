[package]
name = "tessera-lens"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tessera Lens — read-only Stylus data provider. Exposes ERC-4626 quoting (convert/preview) and account views (health factor, safety score, account data) by reading the vault's raw getters and reusing the interest-model math. Holds no funds, no risk-bearing logic; lets the funds-holding vault stay under the 24KB code-size ceiling."

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]

[dependencies]
stylus-sdk = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
interest-model = { path = "../interest-model" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
