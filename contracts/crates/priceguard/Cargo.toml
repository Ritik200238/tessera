[package]
name = "tessera-priceguard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tessera PriceGuard — Stylus oracle policy router: staleness, dual-feed deviation, market-hours haircut, and a circuit breaker. Holds no funds; the vault reads prices and risk-state through it."

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]

[dependencies]
stylus-sdk = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
