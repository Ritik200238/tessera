# Render Blueprint for the Tessera Risk Agent (free tier).
#
# Deploy: Render dashboard -> New + -> Blueprint -> connect this GitHub repo.
# Render reads this file, builds agent/Dockerfile, and provisions the service.
# You'll be prompted for the two secret env vars (sync:false) on first deploy.
#
# Free-tier notes: no persistent disk (SQLite state is ephemeral — fine; the agent
# rebuilds its borrower set from on-chain logs on restart, and on-chain idempotency
# prevents double-actions). The service spins down after ~15 min idle, so a
# keep-alive pinger (see .github/workflows/agent-keepalive.yml) holds it awake.
services:
  - type: web
    name: tessera-agent
    runtime: docker
    plan: free
    # Paths are relative to the REPO ROOT (Render does not apply rootDir to these).
    dockerfilePath: ./agent/Dockerfile
    dockerContext: ./agent
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Robinhood Chain (Orbit, chain 46630) — where the full Tessera stack is
      # deployed (the safety-hardened vault exceeds Sepolia's 24KB code limit).
      - key: CHAIN_ID
        value: "46630"
      - key: RPC_URL
        value: https://rpc.testnet.chain.robinhood.com/rpc
      - key: VAULT_ADDRESS
        value: "0x8bf61ab5984ea1fc8944e645aea11f7c34887f6e"
      - key: USDC_ADDRESS
        value: "0x753b9aC945Feb9dD0C5DD1861B8905e8E03B41dD"
      # RH MockOracle (vault prices through PriceGuard, which wraps this feed).
      - key: ORACLE_ADDRESS
        value: "0x65e6926BCD4EC600d4175019f20abAE07F95316D"
      # Pin the deployer (holds the seeded RH test position) so the agent watches
      # it immediately; the on-chain log scan also discovers other borrowers.
      - key: AGENT_TRACKED_USERS
        value: "0xF1d145384A77Ce10309eA96001BcD5bE19579124"
      - key: AGENT_CORS_ORIGINS
        value: https://tessera-web-delta.vercel.app
      # Secrets — entered in the Render dashboard on first deploy (never committed):
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: AGENT_ADMIN_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: AGENT_INCIDENT_WEBHOOK_URL
        sync: false
